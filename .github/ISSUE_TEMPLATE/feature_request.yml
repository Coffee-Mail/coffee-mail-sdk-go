    id: problema
    attributes:
      label: Qual problema isso resolve
    validations:
      required: true
  - type: textarea
    id: proposta
    attributes:
      label: Proposta
      description: Como você imagina a API? Lembre que os SDKs oficiais mantêm o mesmo contrato.
    validations:
      required: true
