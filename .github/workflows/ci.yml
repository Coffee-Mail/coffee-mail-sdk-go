name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  MIN_GO_VERSION: "1.24"
  COVERAGE_THRESHOLD: "85"

jobs:
  check:
    name: check (Go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ["1.24.x", "stable"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
      - name: Dependências íntegras
        run: go mod verify
      - name: Versão mínima do Go preservada
        run: test "$(go mod edit -json | jq -r .Go)" = "$MIN_GO_VERSION"
      - name: Regras da casa
        run: go run ./internal/tools/standards ./...
      - name: go vet
        run: go vet ./...
      - name: Testes com race detector e cobertura
        run: go test -race -coverprofile=coverage.out -covermode=atomic $(go list ./... | grep -v /examples/)
      - name: Cobertura mínima
        run: |
          TOTAL=$(go tool cover -func=coverage.out | awk '/^total:/ { sub("%", "", $3); print $3 }')
          echo "Cobertura total: ${TOTAL}%"
          awk -v total="$TOTAL" -v min="$COVERAGE_THRESHOLD" 'BEGIN { exit (total + 0 < min + 0) }'

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - run: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0 run ./...

  vulnerabilities:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  compatibility:
    name: compatibilidade da API pública
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: gorelease contra a última versão publicada
        run: |
          BASE=$(git tag --list 'v*' --sort=-v:refname | head -n1)
          if [ -z "$BASE" ]; then
            echo "Nenhuma versão publicada ainda; nada a comparar."
            exit 0
          fi
          OUTPUT=$(go run golang.org/x/exp/cmd/gorelease@v0.0.0-20261014143641-f0251eb4aa3e -base="$BASE" 2>&1 || true)
          echo "$OUTPUT"
          if echo "$OUTPUT" | grep -q "^## incompatible changes"; then
            echo "::error::Mudança incompatível na API pública. Adicione e deprecie; nunca remova ou renomeie."
            exit 1
          fi
